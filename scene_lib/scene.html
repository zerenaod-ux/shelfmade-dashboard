<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="720" height="1280"></canvas>
<script>
'use strict';
/* SCENE ENGINE: draws a whole "living scene" video from one plain description (a spec in JSON).
   The spec lists parts (tank, pipe, pump, house, water, tree, label ...) in back-to-front order, steps (label + narration) and camera moves.
   Any number in a part may be a fixed value or keyframes [[time, value], ...]; the engine moves smoothly between them. World: x right, y up, ground at y=0. */
const W=720,H=1280,FPS=30,ANCH=760;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let SPEC=null,cam={x:0,y:0,s:1},T=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,sm=k=>{k=clamp(k,0,1);return k*k*(3-2*k)};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function kf(v,t,d){if(v===undefined||v===null)return d;if(typeof v==='number')return v;if(!Array.isArray(v)||!v.length)return d;
  if(t<=v[0][0])return v[0][1];for(let i=0;i<v.length-1;i++)if(t<=v[i+1][0])return lerp(v[i][1],v[i+1][1],sm((t-v[i][0])/Math.max(1e-6,v[i+1][0]-v[i][0])));return v[v.length-1][1]}

const S=(x,y)=>[360+(x-cam.x)*cam.s,ANCH-(y-cam.y)*cam.s];
function world(){ctx.setTransform(cam.s,0,0,-cam.s,360-cam.x*cam.s,ANCH+cam.y*cam.s)}
function screen(){ctx.setTransform(1,0,0,1,0,0)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r||0)}
function wrap(text,max){const words=String(text).split(/\s+/),len=String(text).length,n=Math.max(1,Math.ceil(len/max)),target=len/n;const out=[];let line='';for(const w of words){if(line&&out.length<n-1&&(line+' '+w).length>target+3){out.push(line);line=w}else line=(line+' '+w).trim()}if(line)out.push(line);return out}

/* ------------------------------ parts ------------------------------ */
const PARTS={
 sky(p,t){screen();const pre={day:['#2f86d1','#8fd0f2','#ffe9bf'],dusk:['#3b3f8f','#d98ab0','#ffd09a'],clean:['#1f6f8f','#7fc3cf','#e4f3f1']}[p.preset||'day'];
   const g=ctx.createLinearGradient(0,0,0,950);g.addColorStop(0,pre[0]);g.addColorStop(0.55,pre[1]);g.addColorStop(1,pre[2]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
   if(p.sun!==false){const sx=560,sy=330,q=ctx.createRadialGradient(sx,sy,10,sx,sy,260);q.addColorStop(0,'rgba(255,250,225,0.95)');q.addColorStop(0.18,'rgba(255,240,190,0.55)');q.addColorStop(1,'rgba(255,240,190,0)');ctx.fillStyle=q;ctx.fillRect(0,0,W,900)}
   if(p.clouds!==false){ctx.fillStyle='rgba(255,255,255,0.85)';for(let k=0;k<6;k++){const x=((hash(k)*900+t*7-cam.x*0.05)%900+900)%900-90,y=70+hash(k+9)*260,s=0.7+hash(k+5)*0.9;for(const [dx,dy,r] of [[0,0,34],[30,-12,30],[62,0,36],[30,10,40],[-26,6,24]]){ctx.beginPath();ctx.ellipse(x+dx*s,y+dy*s,r*s*1.25,r*s*0.62,0,0,7);ctx.fill()}}}
   if(p.hills!==false){for(const [par,col,amp,zH] of [[0.22,'#9cc5d6',150,260],[0.42,'#7db991',115,190],[0.62,'#63a66d',80,130]]){const sp=lerp(0.75,cam.s,par*0.9),yH=ANCH-(zH-cam.y)*cam.s*lerp(0.55,1,par);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
     for(let x=0;x<=W;x+=8){const wx=(x-360)/sp+cam.x*par+par*5000;ctx.lineTo(x,yH-amp*sp*(0.9+Math.sin(wx*0.0068)*0.5+Math.sin(wx*0.0187+1.3)*0.3+Math.sin(wx*0.046+4)*0.2)-40*sp*Math.sin(wx*0.0031+par*9))}ctx.lineTo(W,H);ctx.fill()}}},
 ground(p,t){world();const y=kf(p.y,t,0),xa=cam.x-400/cam.s,xb=cam.x+400/cam.s,bot=cam.y-(H-ANCH)/cam.s-40;const g=ctx.createLinearGradient(0,y,0,y-420);g.addColorStop(0,p.color||'#86633f');g.addColorStop(0.4,'#6a4b2e');g.addColorStop(1,'#3b2919');ctx.fillStyle=g;ctx.fillRect(xa,bot,xb-xa,y-bot);
   for(const d of [70,150,240,340]){ctx.beginPath();for(let x=xa;x<=xb+12;x+=12){const yy=y-d+8*Math.sin(x*0.013+d);x===xa?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.strokeStyle='rgba(255,235,200,0.10)';ctx.lineWidth=5;ctx.stroke()}
   for(let k=0;k<90;k++){const x=-900+hash(k)*2400,dz=30+hash(k+50)*360;if(x<xa-20||x>xb+20)continue;ctx.fillStyle='rgba(165,140,110,0.45)';ctx.beginPath();ctx.ellipse(x,y-dz,5+hash(k+7)*13,3+hash(k+3)*7,hash(k),0,7);ctx.fill()}
   ctx.fillStyle=p.top||'#5c9f49';ctx.fillRect(xa,y-7,xb-xa,14);ctx.fillStyle='#93d46e';ctx.fillRect(xa,y+4,xb-xa,4)},
 rect(p,t){world();const x=kf(p.x,t,0),y=kf(p.y,t,0),w=kf(p.w,t,10),h=kf(p.h,t,10);ctx.globalAlpha=kf(p.alpha,t,1);rr(x,y,w,h,p.r||0);if(p.fill){ctx.fillStyle=p.fill;ctx.fill()}if(p.stroke){ctx.strokeStyle=p.stroke;ctx.lineWidth=p.lw||2;ctx.stroke()}ctx.globalAlpha=1},

   ctx.beginPath();ctx.moveTo(x0,y0);for(let x=x0;x<=x1;x+=6)ctx.lineTo(x,lv+1.4*Math.sin(x*0.09+t*3));ctx.lineTo(x1,lv);ctx.lineTo(x1,y0);ctx.closePath();ctx.fillStyle=g;ctx.fill();
   ctx.beginPath();for(let x=x0;x<=x1;x+=6){const yy=lv+1.4*Math.sin(x*0.09+t*3);x===x0?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.lineTo(x1,lv);ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2.2;ctx.stroke()},
 pipe(p,t){world();const pts=p.pts,w=p.w||14,pr=clamp(kf(p.progress,t,1),0,1),fl=kf(p.flow,t,0);ctx.lineJoin='round';ctx.lineCap='butt';

   if(pr>0){let L=0;const seg=[];for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(d);L+=d}let left=pr*L;

     ctx.strokeStyle='#2f8fe0';ctx.lineWidth=w-3;ctx.stroke();if(fl>0.05){ctx.setLineDash([9,15]);ctx.lineDashOffset=-t*95*fl;ctx.strokeStyle='rgba(255,255,255,'+0.6*Math.min(1,fl)+')';ctx.lineWidth=Math.max(2,w*0.32);ctx.stroke();ctx.setLineDash([])}}
   for(const q of [pts[0],pts[pts.length-1]]){ctx.fillStyle='#4a5763';ctx.beginPath();ctx.arc(q[0],q[1],(w+9)/2,0,7);ctx.fill()}},
 tower(p,t){world();const x=p.x,by=kf(p.y,t,0),lh=p.legH||240,w=p.w||170,h=p.h||130,lv=clamp(kf(p.level,t,0.5),0,1),x0=x-w/2,y0=by+lh;

   ctx.beginPath();ctx.moveTo(x0,y0);for(let xx=x0;xx<=x0+w;xx+=6)ctx.lineTo(xx,top+1.6*Math.sin(xx*0.1+t*3));ctx.lineTo(x0+w,y0);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.22)';ctx.fillRect(x0+w*0.12,y0,w*0.1,h);ctx.restore();
   rr(x0,y0,w,h,16);ctx.strokeStyle='#44525e';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.moveTo(x0-10,y0+h-2);ctx.lineTo(x,y0+h+46);ctx.lineTo(x0+w+10,y0+h-2);ctx.closePath();ctx.fillStyle=p.roof||'#c0483c';ctx.fill();ctx.strokeStyle='#7a2a22';ctx.lineWidth=3;ctx.stroke()},
 pump(p,t){world();const x=p.x,y=p.y,r=p.r||20,a=integ(p.spin,t);ctx.fillStyle='#3f6f9a';rr(x-r-8,y-r-8,2*r+16,2*r+16,8);ctx.fill();ctx.strokeStyle='#24425c';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#dfe8ee';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
   ctx.strokeStyle='#24425c';ctx.lineWidth=5;ctx.lineCap='round';for(let k=0;k<4;k++){const an=a+k*Math.PI/2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+r*0.5*Math.cos(an+0.6),y+r*0.5*Math.sin(an+0.6),x+r*0.82*Math.cos(an),y+r*0.82*Math.sin(an));ctx.stroke()}ctx.fillStyle='#24425c';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill()},

   ctx.strokeStyle='#7a5a3a';ctx.lineWidth=4;ctx.strokeRect(x,y,w,h);ctx.beginPath();ctx.moveTo(x-16,y+h);ctx.lineTo(x+w/2,y+h+70);ctx.lineTo(x+w+16,y+h);ctx.closePath();ctx.fillStyle=p.roof||'#b5533c';ctx.fill();ctx.strokeStyle='#6e2f20';ctx.stroke();
   ctx.fillStyle=`rgb(${lerp(70,255,lit)},${lerp(80,226,lit)},${lerp(110,120,lit)})`;ctx.fillRect(x+w-52,y+h-58,34,34);ctx.strokeStyle='#7a5a3a';ctx.lineWidth=3;ctx.strokeRect(x+w-52,y+h-58,34,34)},
 stream(p,t){world();const on=kf(p.on,t,1);if(on<=0.02)return;const x=p.x,y1=p.y1,y0=kf(p.y0,t,0),w=(p.w||6)*on;ctx.fillStyle='rgba(150,215,245,0.92)';ctx.beginPath();ctx.moveTo(x-w/2,y1);for(let y=y1;y>=y0;y-=4)ctx.lineTo(x+w/2+0.8*Math.sin(y*0.4+t*18),y);for(let y=y0;y<=y1;y+=4)ctx.lineTo(x-w/2+0.8*Math.sin(y*0.4+t*18+2),y);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,0.85)';for(let k=0;k<6;k++){const ph=(t*2.2+k/6)%1;ctx.beginPath();ctx.arc(x+(hash(k)-.5)*w*5*ph,y0+ph*9*(0.5+hash(k+3)),(1-ph)*w*0.5,0,7);ctx.fill()}},
 spray(p,t){world();const on=kf(p.on,t,1),pw=kf(p.power,t,1),dir=p.dir||1;if(on<=0.02||pw<=0.02)return;ctx.fillStyle='rgba(170,225,250,'+0.9*on+')';for(let k=0;k<70;k++){const ph=((t*1.1+hash(k))%1)*1.25,vx=(120+90*hash(k+11))*pw,vy=(150+90*hash(k+23))*pw,x=p.x+dir*vx*ph,y=p.y+vy*ph-260*ph*ph;if(y<(p.floor||0))continue;ctx.beginPath();ctx.arc(x,y,1.6+1.6*hash(k+5),0,7);ctx.fill()}},
 tree(p,t){world();const g=clamp(kf(p.grow,t,1),0,1),s=(p.s||1)*g,x=p.x,y=p.y||0;if(s<=0.01)return;ctx.fillStyle='#6b4a2e';ctx.fillRect(x-3*s,y,6*s,26*s);
   if(p.kind==='round'){ctx.fillStyle='#4b9a4b';ctx.beginPath();ctx.ellipse(x,y+48*s,26*s,30*s,0,0,7);ctx.fill();ctx.fillStyle='#62b35c';ctx.beginPath();ctx.ellipse(x-7*s,y+56*s,15*s,17*s,0,0,7);ctx.fill()}
   else for(let k=0;k<3;k++){ctx.fillStyle=['#2f6b3a','#35793f','#3d8a47'][k];ctx.beginPath();ctx.moveTo(x-(30-k*6)*s,y+(18+k*20)*s);ctx.lineTo(x+(30-k*6)*s,y+(18+k*20)*s);ctx.lineTo(x,y+(58+k*22)*s);ctx.fill()}},
 plant(p,t){world();const g=clamp(kf(p.grow,t,1),0,1),s=p.s||1,x=p.x,y=p.y||0,hh=46*s*g;if(g<=0.01)return;ctx.strokeStyle='#3d8a47';ctx.lineWidth=3.2*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+4*s*Math.sin(t*1.5+x),y+hh*0.6,x,y+hh);ctx.stroke();
   ctx.fillStyle='#4fae55';for(const [d,k] of [[-1,0.35],[1,0.6]]){ctx.beginPath();ctx.ellipse(x+d*9*s*g,y+hh*k,10*s*g,4.5*s*g,d*0.5,0,7);ctx.fill()}
   const f=clamp((g-0.7)/0.3,0,1);if(f>0){ctx.fillStyle=p.color||'#ff6f91';for(let k=0;k<5;k++){const a=k/5*Math.PI*2+0.3;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*6.5*s*f,y+hh+Math.sin(a)*6.5*s*f,5*s*f,5*s*f,0,0,7);ctx.fill()}ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(x,y+hh,3.6*s*f,0,7);ctx.fill()}},
 wheel(p,t){world();const x=p.x,y=p.y,r=p.r||40,a=integ(p.spin,t),n=p.teeth||10;ctx.fillStyle=p.fill||'#8894a0';ctx.strokeStyle='#39424c';ctx.lineWidth=3;ctx.beginPath();for(let k=0;k<n*2;k++){const an=a+k*Math.PI/n,rad=k%2?r:r*0.84;ctx.lineTo(x+Math.cos(an)*rad,y+Math.sin(an)*rad)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#39424c';ctx.beginPath();ctx.arc(x,y,r*0.16,0,7);ctx.fill();
   for(let k=0;k<4;k++){const an=a+k*Math.PI/2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(an)*r*0.8,y+Math.sin(an)*r*0.8);ctx.stroke()}},
 arrow(p,t){world();const pr=clamp(kf(p.progress,t,1),0,1);if(pr<=0.02)return;const a=p.from,b=[lerp(p.from[0],p.to[0],pr),lerp(p.from[1],p.to[1],pr)],an=Math.atan2(b[1]-a[1],b[0]-a[0]),hd=p.head||14;ctx.strokeStyle=p.color||'#ff5a3c';ctx.fillStyle=p.color||'#ff5a3c';ctx.lineWidth=p.w||5;ctx.lineCap='round';

   rr(q[0]-tw/2,q[1]-fs*0.85,tw,fs*1.7,fs*0.85);ctx.fillStyle=p.bg||'rgba(8,36,60,0.86)';ctx.fill();ctx.fillStyle=p.color||'#fff';ctx.fillText(p.text,q[0],q[1]+1);ctx.globalAlpha=1},

/* ------------------------------ overlay: step tag + big caption ------------------------------ */
function overlay(t){screen();let g=ctx.createLinearGradient(0,0,0,430);g.addColorStop(0,'rgba(8,36,60,0.50)');g.addColorStop(1,'rgba(8,36,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,430);
  g=ctx.createRadialGradient(360,640,430,360,640,880);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,20,30,0.30)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';
  SPEC.steps.forEach((st,i)=>{const a=st.start,b=st.end;if(t<a||t>b)return;const kin=sm((t-a)/0.28),kout=sm((b-t)/0.22),al=Math.min(kin,kout);ctx.globalAlpha=al;
    const lab=(i+1)+' · '+String(st.label||'').toUpperCase();ctx.font='800 25px "DejaVu Sans",Arial,sans-serif';const tw=ctx.measureText(lab).width+44;rr(360-tw/2,104,tw,44,22);ctx.fillStyle='rgba(255,255,255,0.22)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(lab,360,127);
    const lines=st.caption||wrap(st.say,26);let fs=54;ctx.font=`800 ${fs}px "DejaVu Sans",Arial,sans-serif`;const wm=Math.max(...lines.map(l=>ctx.measureText(l).width));if(wm>660){fs=Math.floor(fs*660/wm);ctx.font=`800 ${fs}px "DejaVu Sans",Arial,sans-serif`}
    const y0=188+(1-kin)*16;lines.forEach((l,k)=>{const y=y0+k*fs*1.24+fs*0.5;ctx.lineJoin='round';ctx.strokeStyle='rgba(6,28,52,0.94)';ctx.lineWidth=11;ctx.strokeText(l,360,y);ctx.fillStyle='#fff';ctx.fillText(l,360,y)});ctx.globalAlpha=1})}
function camAt(t){const C=SPEC.camera;let a=C[0],b=C[C.length-1];for(let k=0;k<C.length-1;k++)if(t>=C[k][0]&&t<=C[k+1][0]){a=C[k];b=C[k+1];break}const k=sm((t-a[0])/Math.max(1e-6,b[0]-a[0]));return {x:lerp(a[1],b[1],k),y:lerp(a[2],b[2],k),s:lerp(a[3],b[3],k)}}
function draw(t){T=t;cam=camAt(t);screen();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);for(const p of SPEC.parts){const f=PARTS[p.type];if(!f)throw new Error('unknown part type: '+p.type);ctx.save();f(p,t);ctx.restore()}overlay(t)}
window.loadSpec=function(spec){for(const p of spec.parts)if(!PARTS[p.type])throw new Error('unknown part type: '+p.type);if(!spec.camera||!spec.steps)throw new Error('spec needs camera and steps');SPEC=spec;return Math.ceil(spec.duration*FPS)};
window.partTypes=()=>Object.keys(PARTS);
window.frame=function(f){draw(f/FPS);return cv.toDataURL('image/jpeg',0.93)};
</script></body></html>
