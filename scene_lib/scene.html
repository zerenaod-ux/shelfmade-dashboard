 arrow(p,t){world();const pr=clamp(kf(p.progress,t,1),0,1);if(pr<=0.02)return;const a=p.from,b=[lerp(p.from[0],p.to[0],pr),lerp(p.from[1],p.to[1],pr)],an=Math.atan2(b[1]-a[1],b[0]-a[0]),hd=p.head||14;ctx.strokeStyle=p.color||'#ff5a3c';ctx.fillStyle=p.color||'#ff5a3c';ctx.lineWidth=p.w||5;ctx.lineCap='round';

/* ------------------------------ overlay: step tag + big caption ------------------------------ */
function overlay(t){screen();let g=ctx.createLinearGradient(0,0,0,430);g.addColorStop(0,'rgba(8,36,60,0.50)');g.addColorStop(1,'rgba(8,36,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,430);

  SPEC.steps.forEach((st,i)=>{const a=st.start,b=st.end;if(t<a||t>b)return;const kin=sm((t-a)/0.28),kout=sm((b-t)/0.22),al=Math.min(kin,kout);ctx.globalAlpha=al;
    const lab=(i+1)+' · '+String(st.label||'').toUpperCase();ctx.font='800 25px "DejaVu Sans",Arial,sans-serif';const tw=ctx.measureText(lab).width+44;rr(360-tw/2,104,tw,44,22);ctx.fillStyle='rgba(255,255,255,0.22)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(lab,360,127);
    const lines=st.caption||wrap(st.say,26);let fs=54;ctx.font=`800 ${fs}px "DejaVu Sans",Arial,sans-serif`;const wm=Math.max(...lines.map(l=>ctx.measureText(l).width));if(wm>660){fs=Math.floor(fs*660/wm);ctx.font=`800 ${fs}px "DejaVu Sans",Arial,sans-serif`}

function camAt(t){const C=SPEC.camera;let a=C[0],b=C[C.length-1];for(let k=0;k<C.length-1;k++)if(t>=C[k][0]&&t<=C[k+1][0]){a=C[k];b=C[k+1];break}const k=sm((t-a[0])/Math.max(1e-6,b[0]-a[0]));return {x:lerp(a[1],b[1],k),y:lerp(a[2],b[2],k),s:lerp(a[3],b[3],k)}}
function draw(t){T=t;cam=camAt(t);screen();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);for(const p of SPEC.parts){const f=PARTS[p.type];if(!f)throw new Error('unknown part type: '+p.type);ctx.save();f(p,t);ctx.restore()}overlay(t)}

window.emojiOK=function(chars){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const shot=ch=>{x.clearRect(0,0,64,64);x.font='48px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textBaseline='middle';x.textAlign='center';x.fillText(ch,32,34);const d=x.getImageData(0,0,64,64).data;let ink=0,sig=0;for(let i=3;i<d.length;i+=4){if(d[i]>40){ink++;sig=(sig*31+i)%1000000007}}return [ink,sig]};
  const tofu=shot('\u{10FFFE}');const bad=[];for(const ch of chars){const r=shot(ch);if(r[0]<60||(r[0]===tofu[0]&&r[1]===tofu[1]))bad.push(ch)}return bad};
