name: social-stats
on:
  schedule:
    - cron: '50 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-stats
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect Instagram / TikTok / YouTube numbers from Buffer
        env:
          BUFFER_TOKEN_SHELFMADE: ${{ secrets.BUFFER_TOKEN_SHELFMADE }}
          BUFFER_TOKEN_MINDLORE: ${{ secrets.BUFFER_TOKEN_MINDLORE }}
          BUFFER_TOKEN_DOODLES: ${{ secrets.BUFFER_TOKEN_DOODLES }}
        run: python social_stats.py
      - name: Save results
        if: always()
        run: |
          git config user.name "studio-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/analytics
          git diff --cached --quiet || { git commit -qm "social stats"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
