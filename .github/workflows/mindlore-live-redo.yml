name: mindlore-live-redo
# One-off (owner request 2026-11-08): build the 3 MindLore topics in the new LIVE DEMO look (story-shorts/mindlore/st-261109-live*.json) and send them through the normal review/auto-approve path.
on:
  push:
    paths: ['publish/live-redo.trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation fonts-noto-color-emoji
      - name: Python packages
        run: pip install --quiet pillow numpy edge-tts requests
      - name: Build the 3 videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          mkdir -p out gh-state
          python gh_story_short.py 3
          ls -lh out/*.zip
      - name: Publish to GitHub Release and save state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob; F=(out/ml-story-*.zip)
          [ ${#F[@]} -eq 0 ] && { echo "Nothing built"; exit 1; }
          TAG=mindlore-story-$(date -u +%Y%m%d-%H%M)
          gh release create "$TAG" "${F[@]}" --title "MindLore story Shorts $TAG (live-demo look)" --notes "Built automatically. Goes through the normal review/auto-approve."
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f gh-state/built-story-shorts.json story-shorts data/story-learn-log-mindlore.json
          git commit -m "Record live-demo redo" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep 8; done
