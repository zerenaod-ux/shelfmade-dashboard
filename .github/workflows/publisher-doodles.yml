name: publisher-doodles
on:
  schedule:
    - cron: '55 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publisher-doodles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan or publish Doodles Shorts
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN_DOODLES }}
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE_DOODLES }}
          PUBLISH_BRAND: doodles
        run: python publisher.py
      - name: Start overdue scheduled jobs (GitHub delays or skips crons)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kick.py
      - name: Save publish state
        if: always()
        run: |
          git config user.name "publisher-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/state-doodles.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state change"; exit 0; }
          git commit -qm "publisher: state"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
