name: shelfmade-live-test
on:
  push:
    paths: ['publish/sm-live.trigger']   # first line: ShelfMade story id, e.g. st-261109-b52cc
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation fonts-noto-color-emoji
      - run: pip install --quiet pillow numpy edge-tts requests
      - name: Build
        env:
          LIVE_BRAND: shelfmade
          LIVE_VOICE: en-GB-SoniaNeural
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          SID=$(head -1 publish/sm-live.trigger | cut -d' ' -f1)
          mkdir -p out && python live_demo.py "story-shorts/shelfmade/$SID.json" out/final.mp4
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "smlive-$(date -u +%Y%m%d-%H%M)" out/final.mp4 out/final.mp4.plan.json --title "ShelfMade live look test" --notes "Test only. Not posted."
