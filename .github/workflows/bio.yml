name: bio-page
on:
  workflow_dispatch:
  push:
    paths: ['gen_bio.py', 'books.json', 'affiliate.py', 'affiliate-config.json', 'docs/index.html', 'docs/health.html', 'docs/app/**', '.github/workflows/bio.yml']
  schedule:
    - cron: '45 12 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 gen_bio.py
      - run: mkdir -p bio/review && cp docs/index.html bio/review/index.html && mkdir -p bio/health && cp docs/health.html bio/health/index.html && mkdir -p bio/app && cp docs/app/* bio/app/   # phone review page lives at /review/ next to the bio page
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bio
      - id: dep
        uses: actions/deploy-pages@v4
