name: publisher
on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan or publish ShelfMade Shorts
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN_SHELFMADE }}
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
        run: python publisher.py
      - name: Save publish state
        if: always()
        run: |
          git config user.name "publisher-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/state.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state change"; exit 0; }
          git commit -qm "publisher: state"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
