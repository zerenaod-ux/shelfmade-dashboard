name: doctor
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
  workflow_run:   # react right after a failure instead of waiting for the (often delayed) schedule
    workflows: [watchdog, doctor-drill, doodles, shelfmade-story-short, mindlore-story-short, publisher, publisher-doodles, publisher-mindlore, yt-publish-shelfmade, yt-publish-mindlore, yt-publish-doodles, review-publish, daily-shorts, retitle, flywheel]
    types: [completed]
permissions:
  contents: write
  issues: write
  actions: write
concurrency: doctor
jobs:
  heal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find, fix, verify
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python doctor.py
