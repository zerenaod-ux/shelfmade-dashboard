name: guard
# KILL SWITCH per channel. Run it from the GitHub app (Actions > guard > Run workflow): choose the channel and on (= STOP new posts) or off (= resume).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'shelfmade, mindlore, doodles or all'
        default: 'all'
      mode:
        description: 'on = STOP new posts, off = resume'
        default: 'on'
permissions:
  contents: write
concurrency:
  group: guard
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set
        run: python guard_set.py "${{ inputs.channel }}" "${{ inputs.mode }}"
      - name: Save
        run: |
          git config user.name "guard-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/guard.json
          git diff --cached --quiet && exit 0
          git commit -qm "guard: ${{ inputs.channel }} ${{ inputs.mode }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 6; done
