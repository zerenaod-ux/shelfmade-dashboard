name: review-decide
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: review-decide
  cancel-in-progress: false
jobs:
  decide:
    if: github.event.label.name == 'approve' || github.event.label.name == 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record the decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python review_decide.py
      - name: Save approvals
        run: |
          git config user.name "review-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/approved.json publish/approved-mindlore.json publish/approved-mlfull.json publish/approved-shfull.json publish/approved-doodles.json publish/approved-ddfull.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "review: approved"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
