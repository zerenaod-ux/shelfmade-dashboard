name: howmade
# PAUSED 2026-11-09: YouTube blocks GitHub IPs for captions (0 of 36 hits readable). Manual run only. See ROADMAP M1.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: howmade
jobs:
  howmade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet youtube-transcript-api requests
      - name: How top hits are made
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python howmade.py
      - name: Save results
        run: |
          git config user.name "studio-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/viral
          git diff --cached --quiet || { git commit -qm "how-it's-made study"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
