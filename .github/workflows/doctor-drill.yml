name: doctor-drill
# R8: harmless self-test for the doctor. Break drill_target.py on purpose; the doctor must roll the commit back.
on:
  push:
    paths: [drill_target.py, drill_check.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python drill_check.py
