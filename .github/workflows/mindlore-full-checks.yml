name: MindLore full-video selection checks
on:
  push:
    paths: ['full_release_slots.py', 'mindlore_private_schedule.py', 'tests/test_full_release_slots.py', 'tests/test_mindlore_private_schedule.py', 'yt_publish.py', 'ml_full_selection.py', 'gh_ml2d_build.py', '.github/workflows/mindlore-2d.yml', 'tests/test_ml_full_selection.py', '.github/workflows/mindlore-full-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s tests -p test_ml_full_selection.py -v
      - run: python -m unittest discover -s tests -p test_full_release_slots.py -v
      - run: python -m unittest discover -s tests -p test_mindlore_private_schedule.py -v
      - run: python -m py_compile gh_ml2d_build.py ml_full_selection.py
