name: analytics
on:
  schedule:
    - cron: '30 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: analytics
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect channel statistics
        id: chk
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MINDLORE: ${{ secrets.YT_REFRESH_TOKEN_MINDLORE }}
          YT_REFRESH_TOKEN_SHELFMADE: ${{ secrets.YT_REFRESH_TOKEN_SHELFMADE }}
          YT_REFRESH_TOKEN_DOODLES: ${{ secrets.YT_REFRESH_TOKEN_DOODLES }}
        run: |
          python analytics.py
          python growth.py || true
      - name: Save results
        run: |
          git config user.name "studio-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/analytics data/growth
          git diff --cached --quiet || { git commit -qm "weekly analytics"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
      - name: Phone alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.chk.outcome }}
        run: |
          N=$(gh issue list --state open --search "ALERT: analytics problem in:title" --json number -q '.[0].number' || true)
          if [ "$OUTCOME" = "failure" ]; then
            BODY="Analytics collection failed ($(date -u +%F)):\n\n$(cat alert.md 2>/dev/null)"
            if [ -z "$N" ]; then gh issue create --title "ALERT: analytics problem" --body "$(printf "$BODY")"; else gh issue comment "$N" --body "$(printf "$BODY")"; fi
          elif [ -n "$N" ]; then gh issue close "$N" --comment "Works again."; fi
      - name: Fail when collection failed
        if: steps.chk.outcome == 'failure'
        run: exit 1
