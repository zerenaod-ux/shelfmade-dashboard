name: doodles
on:
  schedule:
    - cron: '30 7 * * *'   # 1:30 AM Chicago (CST)
  workflow_dispatch:
    inputs:
      count:
        description: 'How many Doodles Shorts to make'
        default: '2'
permissions:
  contents: write
concurrency:
  group: doodles
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-liberation fonts-dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu)
      - name: Python packages
        run: pip install --quiet numpy pillow opencv-python-headless six python-slugify python-dateutil requests tqdm urllib3 certifi bleach protobuf text-unidecode kaggle
      - name: Make Doodles Shorts (Kaggle GPU + CPU render)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          COUNT: ${{ github.event.inputs.count || '2' }}
        run: python doodles_engine/gh_doodles.py "$COUNT"
      - name: Publish release (review comes next)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob; F=(out/doodles-*.zip)
          [ ${#F[@]} -gt 0 ] || { echo "no videos made"; exit 0; }
          TAG=doodles-$(date -u +%Y%m%d-%H%M)
          gh release create "$TAG" "${F[@]}" --title "Doodles Shorts $TAG" --notes "Built automatically. Review before posting."
      - name: Save state
        if: always()
        run: |
          git config user.name "doodles-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/doodles/used.json data/doodles/story_pool.json data/doodles/series.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state change"; exit 0; }
          git commit -qm "doodles: state"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
