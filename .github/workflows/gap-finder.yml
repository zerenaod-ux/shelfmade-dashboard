name: gap-finder
on:
  push:
    paths: ['publish/gaps.trigger']
  schedule:
    - cron: '17 14 * * 1'   # Monday: collect + rank everything gathered during the week
    - cron: '17 14 * * 0,2-6'   # other days: only collect
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gap-finder
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan public sources and rank unmet needs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ -f publish/gaps.trigger -a "${{ github.event_name }}" = "push" ]; then python gap_finder.py both; else python gap_finder.py collect; fi
      - name: Save results
        run: |
          git config user.name "studio-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/gaps
          git diff --cached --quiet || { git commit -qm "gap-finder weekly"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
