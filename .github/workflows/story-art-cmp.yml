name: story-art-cmp
# TEST ONLY: compares free image-to-video models (LTX-Video, SVD-XT, CogVideoX) on the free Kaggle GPU. Nothing is posted.
on:
  workflow_dispatch:
  push:
    paths: ['publish/story-art-cmp.trigger']
permissions:
  contents: write
jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet kaggle
      - name: Run comparison on the free GPU
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python shelf_cmp.py
      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete storycmp -y --cleanup-tag || true
          gh release create storycmp out/* --title "free video model comparison (test)" --notes "test only" --prerelease
