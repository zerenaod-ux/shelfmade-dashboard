name: dub-test
on:
  push:
    paths: ['publish/dub.trigger']   # first line of the file: "<story_id> <lang>" e.g. "st-261109-45126 es"
permissions:
  contents: write
jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation fonts-noto-color-emoji
      - run: pip install --quiet pillow numpy edge-tts requests
      - name: Dub
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          read SID LANG < <(head -1 publish/dub.trigger)
          python dub.py "$SID" "$LANG" "out/dub-$LANG"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read SID LANG < <(head -1 publish/dub.trigger)
          gh release create "dub-$LANG-$(date -u +%Y%m%d-%H%M)" out/dub-$LANG/final.mp4 out/dub-$LANG/POST_THIS.txt --title "Dub $LANG $SID" --notes "Test dub. Not posted."
