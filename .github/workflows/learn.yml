name: learn
on:
  schedule:
    - cron: '0 14 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: learn
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect channel statistics
        id: chk
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MINDLORE: ${{ secrets.YT_REFRESH_TOKEN_MINDLORE }}
          YT_REFRESH_TOKEN_SHELFMADE: ${{ secrets.YT_REFRESH_TOKEN_SHELFMADE }}
          YT_REFRESH_TOKEN_DOODLES: ${{ secrets.YT_REFRESH_TOKEN_DOODLES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python analytics.py
          python trends.py
          python learner.py
          python music_learn.py
          python experiments.py || true
      - name: Save results
        run: |
          git config user.name "studio-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/analytics data/trends data/learned data/experiments
          git diff --cached --quiet || { git commit -qm "twice-weekly learning: analytics + viewer notes"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
      - name: Weekly report issue
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * 1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/experiments/report.md ] || exit 0
          gh label create report --color 1D76DB --force || true
          gh issue create --title "Weekly report $(date +%F)" --body-file data/experiments/report.md --label report || true
      - name: Phone alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.chk.outcome }}
        run: |
          N=$(gh issue list --state open --search "ALERT: learning problem in:title" --json number -q '.[0].number' || true)
          if [ "$OUTCOME" = "failure" ]; then
            BODY="Learning loop failed ($(date -u +%F)):\n\n$(cat alert.md 2>/dev/null)"
            if [ -z "$N" ]; then gh issue create --title "ALERT: learning problem" --body "$(printf "$BODY")"; else gh issue comment "$N" --body "$(printf "$BODY")"; fi
          elif [ -n "$N" ]; then gh issue close "$N" --comment "Works again."; fi
      - name: Fail when collection failed
        if: steps.chk.outcome == 'failure'
        run: exit 1
