name: review-publish
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:   # AUTO_RP: run right after a builder finishes
    workflows: [doodles, doodles-full, daily-shorts, mindlore-shorts, mindlore-story-short, mindlore-live-redo, shelfmade-story-short, mindlore-2d, mindlore-full, full-video, recut-shorts]
    types: [completed]
  push:   # one-off kick for the live-demo redo (owner request 2026-11-08)
    paths: ['publish/live-redo.trigger']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: review-publish
  cancel-in-progress: false
jobs:
  open:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ffmpeg
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Open review issues for new videos
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDINARY_JSON: ${{ secrets.CLOUDINARY_JSON }}
          CLOUDINARY_JSON_DOODLES: ${{ secrets.CLOUDINARY_JSON_DOODLES }}
          AUTO_APPROVE_SHORTS: ${{ vars.AUTO_APPROVE_SHORTS }}
        run: python review_publish.py
      - name: Start overdue scheduled jobs (GitHub delays or skips crons)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kick.py
      - name: Save
        if: always()
        run: |
          git config user.name "review-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f review/seen.json review/music-log.json 2>/dev/null || true
          git add -f publish/approved.json publish/approved-mindlore.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "review: seen"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
