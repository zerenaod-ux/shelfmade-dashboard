name: Inspect Doodles proof worker
on:
  push:
    paths: ['publish/doodles-worker-status.trigger']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet kaggle
      - name: Read worker status without starting GPU work
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import subprocess,sys,json
          from pathlib import Path
          output={}
          code='import sys;from kaggle.cli import main;sys.argv=["kaggle"]+sys.argv[1:];main()'
          for worker in ['minddoodles/doodles-make','minddoodles/doodles-ls-run']:
              result=subprocess.run([sys.executable,'-c',code,'kernels','status',worker],capture_output=True,text=True,timeout=60)
              output[worker]={'code':result.returncode,'status':(result.stdout+result.stderr)[-800:]}
          Path('worker-status.json').write_text(json.dumps(output,indent=2))
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: doodles-worker-status
          path: worker-status.json
