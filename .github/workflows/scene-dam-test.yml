name: scene-dam-test
# TEST ONLY: renders the river-and-dam "living scene" (simulated water, one continuous shot) and attaches it to a prerelease. Nothing is posted.
on:
  workflow_dispatch:
  push:
    paths: ['publish/scene-dam.trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy imageio-ffmpeg
      - name: Render the scene
        working-directory: scene_dam
        run: |
          npm init -y > /dev/null
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --silent playwright@1.49.1
          CHROME_CHANNEL=chrome node render.js full '[4600,60]' || (npx playwright install chromium && node render.js full '[4600,60]')
          python3 assemble.py
      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(); for f in scene_dam/*.mp4; do [ -f "$f" ] && files+=("$f"); done
          echo "attaching: ${files[*]}"
          gh release delete scenedam -y --cleanup-tag || true
          gh release create scenedam "${files[@]}" --title "River-and-dam scene TEST (not posted)" --notes "test only" --prerelease
