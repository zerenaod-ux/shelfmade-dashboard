name: shelfmade-purge-old
# One-off (owner request 2026-11-23): whiteboard videos first; old story-shorts removed from Buffer and parked (restorable).
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publisher
  cancel-in-progress: false
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove old scheduled posts and park the waiting ones
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN_SHELFMADE }}
        run: python purge_shelfmade.py
      - name: Schedule the whiteboard Shorts now
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN_SHELFMADE }}
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
        run: python publisher.py
      - name: Save
        if: always()
        run: |
          git config user.name "publisher-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/state.json publish/approved.json publish/queue.json publish/approved-parked-oldstories.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "ShelfMade: whiteboard videos first, old stories parked (restorable)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
