name: queue-titles
on:
  workflow_dispatch:
    inputs:
      cap:
        description: 'max titles to rewrite per queue file'
        default: '40'
permissions:
  contents: write
concurrency:
  group: queue-titles
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rewrite waiting titles to the title rule
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python queue_titles.py "${{ inputs.cap }}"
      - name: Save
        run: |
          git config user.name "titles-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/approved*.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -qm "queue titles: follow the title rule"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
