name: livedemo-test
# TEST ONLY: builds 3 MindLore "live demo" sample videos (different topics) and attaches them to a GitHub Release. Nothing is posted.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/livedemo-test.yml', 'live_demo.py', 'brain_demo.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-noto-color-emoji
      - run: pip install --quiet pillow numpy edge-tts requests
      - name: Build 3 samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          mkdir -p out
          python live_demo.py story-shorts/mindlore/st-261105-3c4dc.json out/ld-stress.mp4
          python live_demo.py story-shorts/mindlore/st-261106-b5824.json out/ld-multitasking.mp4
          python live_demo.py story-shorts/mindlore/st-261107-43f84.json out/ld-money.mp4
          ls -l out
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete livedemo -y --cleanup-tag || true
          gh release create livedemo out/*.mp4 out/*.plan.json --title "MindLore live-demo TEST (not posted)" --notes "test only" --prerelease
