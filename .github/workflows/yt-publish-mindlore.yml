name: yt-publish-mindlore
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yt-publish-mindlore
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload approved MindLore full videos to YouTube
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_MINDLORE }}
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE_MLFULL }}
        run: python yt_publish.py
      - name: Save state
        if: always()
        run: |
          git config user.name "publisher-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f publish/state-mlfull.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state change"; exit 0; }
          git commit -qm "yt-publish: state"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
