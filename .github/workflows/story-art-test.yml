name: story-art-test
# TEST ONLY: builds 2 ShelfMade "idea as a changing picture" sample Shorts and attaches them to a prerelease. Nothing is posted.
on:
  workflow_dispatch:
  push:
    paths: ['publish/story-art.trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu
      - run: pip install --quiet pillow numpy edge-tts requests
      - name: Build samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          mkdir -p out
          python story_art.py "As a Man Thinketh" "James Allen" out/art-manthinketh.mp4 || echo "FAILED 1"
          python story_art.py "The Art of War" "Sun Tzu" out/art-artofwar.mp4 || echo "FAILED 2"
          ls -l out
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete storyart -y --cleanup-tag || true
          gh release create storyart out/*.mp4 --title "ShelfMade story-art TEST (not posted)" --notes "test only" --prerelease
