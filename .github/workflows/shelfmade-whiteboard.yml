name: shelfmade-whiteboard
# ShelfMade daily production in the ONE-CANVAS WHITEBOARD style (owner 2026-11-22): 1 long video (8-10 min) + 2 Shorts (40-60 s) every day.
# Replaces shelfmade-story-short and full-video. Each video goes to a GitHub Release (tag shorts-wb-* / full-wb-*) and then the normal review-publish flow.
on:
  schedule:
    - cron: '10 13 * * *'   # 7:10 AM Chicago in winter (CST = UTC-6). Fixed 2026-11-24: was 12:10 UTC (6:10 AM). Change to '10 12' when daylight saving starts in March.
  workflow_dispatch:
    inputs:
      only:
        description: 'all, long, or short (default all)'
        default: 'all'
      clip:
        description: 'true = also cut an extra Short from the long video (off by default: you asked for 2 Shorts a day)'
        default: 'false'
      test:
        description: 'true = test run: release is NOT picked up for review/posting'
        default: 'false'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: [long, short1, short2]
    steps:
      - name: Skip jobs not asked for
        id: gate
        run: |
          O="${{ github.event.inputs.only || 'all' }}"; J="${{ matrix.job }}"
          if [ "$O" = "all" ] || [ "$O" = "${J%%[0-9]*}" ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "go=0" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: '3.11'
      - name: System packages
        if: steps.gate.outputs.go == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - name: Python packages
        if: steps.gate.outputs.go == '1'
        run: pip install --quiet numpy opencv-python-headless pillow edge-tts requests
      - name: Build (up to 4 tries, same topic)
        if: steps.gate.outputs.go == '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CE_VOICE_ENGINE: edge
          JOB: ${{ matrix.job }}
        run: |
          mkdir -p out
          KIND=short; MIN=1; [ "$JOB" = "long" ] && { KIND=long; MIN=13; }
          for i in 1 2 3 4 5 6; do TOPIC="$(python wb_auto.py | tail -1)" && break; sleep 120; done
          [ -n "$TOPIC" ] || { echo "no topic"; exit 1; }
          echo "TOPIC: $TOPIC"
          export WB_CACHE="$PWD/out/cache-$JOB.json"
          for i in 1 2 3 4 5 6; do
            rm -rf out/wb; python wb_build.py "$TOPIC" out/wb $MIN $KIND 2>&1 | tee out/build.log
            [ "${PIPESTATUS[0]}" = "0" ] && OK=1 && break
            grep -q "^LENGTH" out/build.log && rm -f "$WB_CACHE"   # a script of the wrong length is thrown away, not reused
            echo "try $i failed"; sleep 240
          done
          [ "$OK" = "1" ] || exit 1
          rm -rf out/wb/work
          cp out/wb/script.json out/long-script.json 2>/dev/null; python wb_pack.py out/wb $KIND "$(date -u +%Y%m%d)-$JOB"
      - name: Extra Short cut from the long video (only if clip=true)
        if: steps.gate.outputs.go == '1' && matrix.job == 'long' && github.event.inputs.clip == 'true'
        run: |
          python wb_clip.py out/wb out/clip && python wb_pack.py out/clip short "$(date -u +%Y%m%d)-clip" && mkdir -p out/clipzip && mv out/sm-wb-*-clip.zip out/clipzip/ || echo "clip skipped"
      - name: Release for review and save topic history
        if: steps.gate.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ matrix.job }}
        run: |
          if [ "$JOB" = "long" ]; then TAG="full-wb-${{ github.run_id }}"; else TAG="shorts-wb-${{ github.run_id }}-$JOB"; fi
          [ "${{ github.event.inputs.test }}" = "true" ] && TAG="wbtest-$TAG"
          if ls out/clipzip/*.zip >/dev/null 2>&1; then CT="${TAG/full-wb-/shorts-wb-}-clip"; gh release create "$CT" out/clipzip/*.zip --title "ShelfMade whiteboard clip ${{ github.run_id }}" --notes "Extra Short cut from the long video."; fi
          gh release create "$TAG" out/sm-wb-*.zip --title "ShelfMade whiteboard $JOB ${{ github.run_id }}" --notes "Built automatically in the whiteboard style. Review before posting."
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add data/wb-history.json
          git commit -qm "whiteboard topic history ($JOB)" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin master && git push -q origin master && break; sleep 8; done
  kick-review:
    # GitHub's schedule/workflow_run triggers are often hours late (seen 2026-11-25: videos waited 3 h for review). Start review-publish ourselves.
    needs: build
    if: always() && github.event.inputs.test != 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/review-publish.yml/dispatches -f ref=master
