name: scene-factory
# TEST ONLY: the full factory. Topic in -> the writer (free LLM) writes the scene description -> checker -> scene engine draws it -> narrator, sounds, music -> video on a prerelease. Nothing is posted.
# Start it by pushing publish/scene-factory.trigger whose first line is the topic.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to explain (one line)'
        required: true
  push:
    paths: ['publish/scene-factory.trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pillow imageio-ffmpeg edge-tts requests
      - name: Write the scene (free LLM + checker)
        env:
          TOPIC_IN: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$TOPIC_IN" ]; then printf '%s\n' "$TOPIC_IN" > topic.txt; else cp publish/scene-factory.trigger topic.txt; fi
          python3 scene_lib/writer.py --topic-file topic.txt auto-scene.json
      - name: Draw, check and assemble the video
        run: |
          npm init -y > /dev/null
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --silent playwright@1.49.1
          CHROME_CHANNEL=chrome node scene_lib/render.js auto-scene.json || (npx playwright install chromium && node scene_lib/render.js auto-scene.json)
          python3 scene_lib/check_frames.py auto-scene.json | tee -a writer-log.txt
          python3 scene_lib/assemble.py auto-scene.json scene-factory.mp4
      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(); for f in scene-factory.mp4 auto-scene.json auto-plan.json writer-log.txt voice-log.txt; do [ -f "$f" ] && files+=("$f"); done
          echo "attaching: ${files[*]}"
          gh release delete scene-factory -y --cleanup-tag || true
          gh release create scene-factory "${files[@]}" --title "Scene factory test (not posted)" --notes "test only: topic in, video out" --prerelease
