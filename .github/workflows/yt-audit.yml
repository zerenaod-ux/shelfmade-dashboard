name: yt-audit
# Owner request 2026-11-11: MindLore posts only NEW-look full videos, one a day. Audit (and optionally unschedule old-look) YouTube full uploads.
on:
  push:
    paths: ['publish/yt-audit.trigger']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yt-publish-mindlore
  cancel-in-progress: false
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: mlfull, secret: YT_REFRESH_TOKEN_MINDLORE}
          - {kind: shfull, secret: YT_REFRESH_TOKEN_SHELFMADE}
          - {kind: ddfull, secret: YT_REFRESH_TOKEN_DOODLES}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit MindLore full videos on YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[matrix.secret] }}
          YT_KIND: ${{ matrix.kind }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_DOODLES }}
          KEEP: o3yiUpFfU8c
        run: |
          unset UNSCHEDULE  # Strictly read-only owner-requested visibility audit
          python yt_audit.py
