name: doodles-full
on:
  schedule:
    - cron: '40 6 * * 2,5'   # Tue + Fri ~1:40 AM Chicago; GitHub may delay it, gh_kick starts it if overdue
  workflow_dispatch:
    inputs:
      test_scenes:
        description: 'Test: only the first N scenes (0 = full 12-scene episode)'
        default: '0'
      landscape:
        description: 'Widescreen test: 1 = true 16:9 pictures (new), 0 = current vertical look'
        default: '0'
permissions:
  contents: write
concurrency:
  group: doodles
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-liberation fonts-dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu)
      - name: Python packages
        run: pip install --quiet numpy scipy pillow opencv-python-headless six python-slugify python-dateutil requests tqdm urllib3 certifi bleach protobuf text-unidecode kaggle
      - name: Make the Doodles full video (Kaggle GPU + CPU render + stitch)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TEST: ${{ github.event.inputs.test_scenes || '0' }}
          EPISODE_LANDSCAPE: ${{ github.event.inputs.landscape || '0' }}
        run: |
          if [ "$TEST" != "0" ]; then python doodles_engine/gh_doodles_episode.py --test "$TEST"; else python doodles_engine/gh_doodles_episode.py; fi
      - name: Publish release (review comes next)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob; F=(out/doodles-full-*.zip)
          [ ${#F[@]} -gt 0 ] || { echo "no video made"; exit 0; }
          TAG=ddfull-$(date -u +%Y%m%d-%H%M)
          gh release create "$TAG" "${F[@]}" --title "Doodles full video $TAG" --notes "Built automatically. Review before posting."
      - name: Save state
        if: always()
        run: |
          git config user.name "doodles-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/doodles/episode_pool.json data/doodles/episodes_used.json data/doodles/series.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state change"; exit 0; }
          git commit -qm "doodles-full: state"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 6; done
