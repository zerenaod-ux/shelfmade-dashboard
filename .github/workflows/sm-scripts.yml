name: sm-scripts
on:
  schedule:
    - cron: '50 8,14,20,2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many new ShelfMade scripts to write'
        default: '3'
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Packages for the builder checks
        run: pip install --quiet numpy pillow requests
      - name: Write and check new scripts
        timeout-minutes: 110
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ML_PER_PASS: ${{ github.event.inputs.count || '2' }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "GEMINI_API_KEY secret missing"; exit 1; }
          mkdir -p data/writer-logs; set -o pipefail
          ML_BRAND=shelfmade python -u ml_autoscripts.py 2>&1 | tee data/writer-logs/sm.log
      - name: Save new scripts
        if: always()
        run: |
          git config user.name "shelfmade-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f cinematic-scripts
          git add -f data/writer-logs/sm.log 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "ShelfMade: new scripts written and checked automatically"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 5)); done
