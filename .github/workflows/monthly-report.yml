name: monthly-report
on:
  schedule:
    - cron: '17 15 1 * *'
  workflow_dispatch:
  workflow_run:   # GitHub's timer is often late/skipped: also try after review-publish (the script only acts on days 1-5 and only once)
    workflows: [review-publish]
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Monthly report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python monthly_report.py
