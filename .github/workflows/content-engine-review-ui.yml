name: content-engine-review-ui
on:
  pull_request:
    paths: ['docs/app/**', 'tests/content-engine-review-ui.cjs', '.github/workflows/content-engine-review-ui.yml', '.github/workflows/bio.yml']
permissions:
  contents: read
jobs:
  phone-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix /tmp/ce-ui-test --no-package-lock --no-save playwright@1.49.1
      - run: /tmp/ce-ui-test/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/content-engine-review-ui.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/ce-ui-test/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-engine-phone-preview
          path: content-engine-review-preview.png
