name: whiteboard-video
# ShelfMade one-canvas whiteboard video. Manual, or twice a week with an AI-chosen topic. Never published automatically: lands in Releases for review.
on:
  schedule:
    - cron: '17 14 * * 2,5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to explain (plain words); empty = AI picks a fresh one'
        required: false
        default: ''
      minutes:
        description: 'Length in minutes'
        default: '8'
      demo:
        description: 'true = built-in test script, no AI'
        default: 'false'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - name: Python packages
        run: pip install --quiet numpy opencv-python-headless pillow edge-tts requests
      - name: Build video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CE_VOICE_ENGINE: edge
          TOPIC: ${{ github.event.inputs.topic }}
          MINUTES: ${{ github.event.inputs.minutes }}
          DEMO: ${{ github.event.inputs.demo }}
        run: |
          mkdir -p out
          if [ -z "$TOPIC" ]; then TOPIC="$(python wb_auto.py | tail -1)"; fi
          echo "TOPIC: $TOPIC"
          if [ "$DEMO" = "true" ]; then python wb_build.py --demo out/wb; else python wb_build.py "$TOPIC" out/wb "${MINUTES:-8}"; fi
          rm -rf out/wb/work
      - name: Keep the video as a release file (14 days is not needed; owner downloads from Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add data/wb-history.json && git commit -qm 'whiteboard topic history' && git pull -q --rebase origin master && git push -q origin master || true
          TAG="whiteboard-${{ github.run_id }}"
          gh release create "$TAG" out/wb/WHITEBOARD.mp4 out/wb/POST_THIS.txt out/wb/script.json out/wb/spec.json --title "Whiteboard video ${{ github.run_id }}" --notes "Built by whiteboard-video workflow. Not published anywhere." --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: whiteboard-video
          path: out/wb
          retention-days: 14
