name: whiteboard-video
# ShelfMade one-canvas whiteboard video (manual only; nothing is published automatically)
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to explain (plain words)'
        required: true
      minutes:
        description: 'Length in minutes'
        default: '8'
      demo:
        description: 'true = built-in test script, no AI'
        default: 'false'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Python packages
        run: pip install --quiet numpy opencv-python-headless pillow edge-tts requests
      - name: Build video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CE_VOICE_ENGINE: edge
          TOPIC: ${{ github.event.inputs.topic }}
          MINUTES: ${{ github.event.inputs.minutes }}
          DEMO: ${{ github.event.inputs.demo }}
        run: |
          mkdir -p out
          if [ "$DEMO" = "true" ]; then python wb_build.py --demo out/wb; else python wb_build.py "$TOPIC" out/wb "$MINUTES"; fi
          rm -rf out/wb/work
      - uses: actions/upload-artifact@v4
        with:
          name: whiteboard-video
          path: out/wb
          retention-days: 14
