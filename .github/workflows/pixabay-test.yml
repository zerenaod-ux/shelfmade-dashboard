name: pixabay-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Live Pixabay adapter test (prints no secrets)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import pixabay_adapter as p, urllib.parse
          d = p.search('person shadow wall light')
          v = d['videos']
          ok = [x for x in v if any(f['width'] >= 1280 and f['height'] >= 720 and f['width'] > f['height'] and urllib.parse.urlparse(f['link']).hostname.endswith('.pixabay.com') for f in x['video_files'])]
          print('PIXABAY videos', len(v), 'usable HD landscape', len(ok), 'sample slug', (v[0]['url'] if v else ''))
          assert v and ok, 'no usable footage'
          print('PIXABAY TEST PASSED')
          PY
