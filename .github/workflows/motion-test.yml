name: motion-test
# TEST ONLY: never touches the live pipeline, posts nothing, opens no review Issue. Results go to a pre-release named motiontest-*.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Source release with a finished clean Doodles clip (empty = newest ddfull-*)'
        default: ''
permissions:
  contents: write
concurrency:
  group: motiontest
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tools
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
          pip install --quiet "rembg[cpu]" opencv-python-headless numpy pillow
      - name: Get a clean Doodles clip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          [ -n "$TAG" ] || TAG=$(gh release list --limit 40 --json tagName -q '.[].tagName' | grep '^ddfull-' | head -1)
          echo "source release: $TAG"
          mkdir -p src && gh release download "$TAG" --pattern '*.zip' --dir src
          unzip -o -q src/*.zip final.mp4 -d src
          ls -la src
      - name: Cut out characters and render the demo
        run: python motion_test.py src/final.mp4 out_motion
      - name: Publish test results (pre-release, ignored by the review pipeline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=motiontest-$(date -u +%Y%m%d-%H%M)
          gh release create "$TAG" out_motion/* --prerelease --title "Motion test $TAG" --notes "$(cat out_motion/report.txt)"
