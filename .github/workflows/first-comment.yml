name: first-comment
on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: '1 = really post the comments, 0 = dry run (only shows what it would post)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: first-comment
jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comment on new Shorts (links to the newest full video)
        env:
          FIRST_COMMENT_LIVE: ${{ github.event.inputs.live || '1' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MINDLORE: ${{ secrets.YT_REFRESH_TOKEN_MINDLORE }}
          YT_REFRESH_TOKEN_SHELFMADE: ${{ secrets.YT_REFRESH_TOKEN_SHELFMADE }}
          YT_REFRESH_TOKEN_DOODLES: ${{ secrets.YT_REFRESH_TOKEN_DOODLES }}
        run: python first_comment.py
      - name: Save what was already commented
        if: always()
        run: |
          git config user.name "reply-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/replies
          git diff --cached --quiet && exit 0
          git commit -qm "first comment: done list"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
