name: retitle
# Owner-authorized campaign: short hooky TRUE titles for every ShelfMade + MindLore Short (canary batches). Run with mode revert-all to put every auto-changed title back.
on:
  schedule:
    - cron: '31 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run, revert-all, revert-mindlore or ids:ID1,ID2'
        default: 'run'
permissions:
  contents: write
concurrency:
  group: retitle
jobs:
  retitle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retitle
        env:
          RETITLE_LIVE: '1'
          MODE: ${{ github.event.inputs.mode || 'run' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MINDLORE: ${{ secrets.YT_REFRESH_TOKEN_MINDLORE }}
          YT_REFRESH_TOKEN_SHELFMADE: ${{ secrets.YT_REFRESH_TOKEN_SHELFMADE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          case "$MODE" in revert-all) python retitle.py revert-all;; revert-mindlore) python retitle.py revert-all mindlore;; ids:*) python retitle.py revert-all "$MODE";; *) python retitle.py;; esac
      - name: Save
        if: always()
        run: |
          git config user.name "retitle-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f data/growth/title_log.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "retitle: batch"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 6; done
