<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShelfMade · Owner access</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ea;color:#243c32;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}.box{background:white;border:1px solid #ded6c6;padding:36px;border-radius:18px;max-width:480px;width:100%}h1{font:34px Georgia;margin:12px 0}small{letter-spacing:2px;color:#937c3b}input,button{font:inherit;border-radius:8px;padding:14px;width:100%;margin-top:10px}input{border:1px solid #c9cfc9}button{background:#243c32;color:white;border:0;cursor:pointer}p{line-height:1.6}#error{color:#993b30;min-height:24px}label{display:block;margin-top:20px}
</style><main class="box"><small>CONTENT EMPIRE / SHELFMADE</small><h1 id="title">Owner access</h1><p id="description">Checking your workspace…</p><form id="form"><label for="password">Passphrase</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit">Continue</button></form><p id="error" role="alert"></p><p>Private workspace hosted on your laptop.</p></main><script>
let setup=false;async function init(){try{const r=await fetch('/api/auth/status');if(!r.ok)throw Error('Unable to check owner access');const state=await r.json();setup=!state.configured;document.getElementById('title').textContent=setup?'Protect your studio':'Welcome back';document.getElementById('description').textContent=setup?'Create an owner passphrase with at least 12 characters. Keep it somewhere safe; you will need it to sign in.':'Sign in to review videos and manage generation.';document.getElementById('password').autocomplete=setup?'new-password':'current-password';document.getElementById('password').minLength=setup?12:1;document.getElementById('submit').textContent=setup?'Create owner access':'Sign in'}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;try{const r=await fetch(setup?'/auth/setup':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-ShelfMade':'local'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Sign-in failed');location.replace('/')}catch(e){document.getElementById('error').textContent=e.message}finally{b.disabled=false}};init();
</script></html>
